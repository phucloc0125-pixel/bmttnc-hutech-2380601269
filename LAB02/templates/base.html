<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mật mã học - HUTECH{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1e38 0%, #0d0d1b 50%, #05050d 100%);
            --card-bg: rgba(18, 18, 39, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #4f46e5;
            --accent-secondary: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(10, 10, 26, 0.6);
            --input-border: rgba(255, 255, 255, 0.15);
            --shadow-primary: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Glassmorphism Container */
        .app-container {
            max-width: 850px;
            width: 90%;
            margin: 40px auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-primary);
            transition: all 0.3s ease;
        }

        /* Header Styles */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            max-width: 260px;
            height: auto;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.1));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.03);
        }

        .title-main {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .student-info {
            text-align: center;
            font-size: 16px;
            color: var(--accent-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .student-info i {
            font-size: 14px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1) 20%, rgba(255, 255, 255, 0.1) 80%, transparent);
            margin-bottom: 30px;
        }

        /* Footer Styles */
        footer {
            text-align: center;
            padding: 25px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: auto;
        }

        footer a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        /* Utility styles for forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        }

        .btn-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            width: 100%;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            filter: brightness(1.1);
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        /* Back Button */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-secondary);
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Back navigation if not home -->
        {% block back_button %}{% endblock %}

        <header>
            <div class="logo-container">
                <img class="logo-img" src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="HUTECH Logo">
            </div>
            <h1 class="title-main">Bài Thực Hành Bảo Mật Thông Tin Nâng Cao</h1>
            <div class="student-info">
                <i class="fa-solid fa-graduation-cap"></i>
                Lê Hoàng Phúc Lộc - 2380601269
            </div>
            <div class="divider"></div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer>
        <p>Khoa Công nghệ Thông tin - HUTECH &copy; 2026. Thiết kế bởi <a href="#">Lê Hoàng Phúc Lộc</a></p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
